<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your orders — Mabs Technologies</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#22313a">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mabs.css">
</head>
<body class="mabs" data-page="orders">
<div id="site-header"></div>

<main id="main" class="account-page">
  <div class="wrap">
    <nav class="crumbs account-crumbs" aria-label="Breadcrumb"><ol>
      <li><a href="orders.html">My Account</a></li>
      <li aria-current="page">Orders</li>
    </ol></nav>

    <div class="account-layout">
      <aside class="account-nav" id="account-nav" aria-label="My Account"></aside>

      <section class="account-main" aria-labelledby="orders-title">
        <div class="account-head">
          <h1 id="orders-title">Orders</h1>
          <label class="period">
            <span>Orders placed in:</span>
            <select id="period">
              <option value="30">Last 30 days</option>
              <option value="90" selected>Last 3 months</option>
              <option value="180">Last 6 months</option>
              <option value="365">Past year</option>
              <option value="all">All time</option>
            </select>
          </label>
        </div>
        <div class="account-panel" id="orders" aria-live="polite"></div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script src="js/account.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
