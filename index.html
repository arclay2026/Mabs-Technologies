<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mabs Technologies — Computers, Phones, Accessories &amp; Electronics</title>
<meta name="description" content="Shop laptops, desktops, smartphones, tablets, accessories and home electronics at Mabs Technologies. Delivery or free in-store collection.">
<!-- link previews (WhatsApp, Facebook, X): image needs a full address; update it when the shop moves to its own domain -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mabs Technologies">
<meta property="og:title" content="Mabs Technologies — Computers, Phones, Accessories &amp; Electronics">
<meta property="og:description" content="Shop laptops, desktops, smartphones, tablets, accessories and home electronics at Mabs Technologies. Delivery or free in-store collection.">
<meta property="og:image" content="https://arclay2026.github.io/Mabs-Technologies/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#22313a">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mabs.css?v=202610221830">
<link rel="stylesheet" href="css/select.css?v=202610221830">
</head>
<body class="mabs" data-page="home">
<div id="site-header"></div>

<main id="main">

  <div class="view-prefs">
    <span id="newtab-label">Open products in new tab:</span>
    <button type="button" class="switch" id="newtab-switch" role="switch" aria-checked="false" aria-labelledby="newtab-label"><span></span></button>
  </div>

  <!-- Homepage carousel: slides are listed in MABS.slides (js/catalog.js) -->
  <section class="hero" id="hero" aria-label="Featured">
    <h1 class="sr-only">Mabs Technologies — computers, phones, accessories &amp; electronics</h1>
  </section>

  <section class="brands" aria-labelledby="brands-title">
    <div class="wrap"><h2 class="brands-title" id="brands-title">Featured brands</h2></div>
    <div class="marquee"><div class="marquee-track" id="brand-track"></div></div>
  </section>

  <section class="section" aria-labelledby="cats-title">
    <div class="wrap">
      <div class="section-head">
        <h2 id="cats-title">Shop by category</h2>
      </div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
  </section>

  <section class="section section-alt" id="deals" aria-labelledby="deals-title">
    <div class="wrap">
      <div class="section-head">
        <h2 id="deals-title">On sale now</h2>
        <a class="more" href="?deals=1#shop">View all deals</a>
      </div>
      <div class="grid rail-mobile" id="deal-rail"></div>
    </div>
  </section>

  <section class="section section-alt shop" id="shop" aria-labelledby="shop-title">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 id="shop-title">All products</h2>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>
        <div class="shop-tools">
          <button type="button" class="btn btn-ghost filter-toggle" id="filter-toggle" aria-controls="filters" aria-expanded="false"></button>
          <label class="sort">
            <span>Sort by</span>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="discount">Biggest saving</option>
              <option value="name">Name A–Z</option>
            </select>
          </label>
        </div>
      </div>

      <div class="shop-layout">
        <form class="filters" id="filters" aria-label="Filter products">
          <div class="filters-head">
            <h3>Filters</h3>
            <button type="button" class="link-btn" id="clear-filters">Clear all</button>
            <button type="button" class="icon-btn filters-close" id="filters-close" aria-label="Close filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <fieldset>
            <legend>Category</legend>
            <div id="f-cats"></div>
          </fieldset>
          <fieldset id="f-types-set" hidden>
            <legend>Type</legend>
            <div id="f-types"></div>
          </fieldset>
          <fieldset>
            <legend>Brand</legend>
            <div id="f-brands"></div>
          </fieldset>
          <fieldset>
            <legend>Price (R)</legend>
            <div class="price-range">
              <label><span class="sr-only">Minimum price</span><input type="number" id="f-min" min="0" step="100" placeholder="Min" inputmode="numeric"></label>
              <span aria-hidden="true">–</span>
              <label><span class="sr-only">Maximum price</span><input type="number" id="f-max" min="0" step="100" placeholder="Max" inputmode="numeric"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Show</legend>
            <label class="check"><input type="checkbox" id="f-stock"> In stock only</label>
            <label class="check"><input type="checkbox" id="f-deals"> On sale</label>
            <label class="check"><input type="checkbox" id="f-wish"> My wishlist</label>
          </fieldset>
          <button type="button" class="btn btn-primary btn-block filters-done" id="filters-done">Show results</button>
        </form>

        <div class="shop-results">
          <div class="chips" id="chips"></div>
          <div class="grid" id="grid"></div>
          <div class="more-bar" id="more-bar"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="js/catalog.js?v=202610221830"></script>
<script src="js/api.js?v=202610221830" data-load="js/select.js js/app.js js/shop.js"></script>
</body>
</html>
